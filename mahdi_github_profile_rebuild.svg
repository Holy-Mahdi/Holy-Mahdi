<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11171c"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1a252c" stroke-width="0.8"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect x="10" y="12" width="1516" height="334" rx="12" fill="#0b1014" stroke="#151e24" stroke-width="1.2"/>
  <rect x="40" y="47" width="1456" height="272" fill="url(#grid)" opacity="0.82"/>

  <!-- Global text styles -->
  <style>
    .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace; fill: #d8dee9; }
    .dim { fill: #9aa5b1; }
    .faint { fill: #71808d; }
    .line { stroke: #c7d0d9; stroke-width: 1.2; fill: none; }
    .line2 { stroke: #8c99a5; stroke-width: 1; fill: none; }
    .box { fill: #0f151a; stroke: #c7d0d9; stroke-width: 1.2; }
    .small { font-size: 14px; letter-spacing: 1.6px; }
    .tiny { font-size: 12px; letter-spacing: 1.2px; }
    .section { font-size: 28px; font-weight: 600; }
    .body { font-size: 18px; }
  </style>

  <!-- Left waveform / hardware block -->
  <g transform="translate(48,78)" class="mono">
    <text x="0" y="32" class="small">clk</text>
    <path class="line" d="M42 36 h20 v-26 h20 v26 h20 v-26 h20 v26 h20 v-26 h20 v26 h12"/>
    <text x="0" y="72" class="small">rst</text>
    <path class="line" d="M42 76 h60 v-22 h12 v22 h70"/>
    <text x="0" y="112" class="small">valid</text>
    <path class="line" d="M42 116 h20 v-24 h40 v24 h70"/>
    <text x="0" y="148" class="small">data</text>
    <path class="line" d="M42 152 h34 l8-12 h38 l8 12 h38 l8-12 h28"/>
    <path class="line" d="M76 164 l8-12 M122 140 l8 12 M168 152 l8 12"/>
    <text x="46" y="190" class="small">...</text>

    <path class="line" d="M186 78 h20"/>
    <path class="line" d="M202 74 l6 4 -6 4"/>

    <rect class="box" x="212" y="51" width="58" height="54"/>
    <text x="227" y="84" class="small">RTL</text>
    <path class="line" d="M270 78 h39"/>
    <path class="line" d="M303 74 l6 4 -6 4"/>

    <rect class="box" x="316" y="51" width="74" height="54"/>
    <text x="329" y="84" class="small">SYNTH</text>
    <path class="line" d="M390 78 h38"/>
    <path class="line" d="M422 74 l6 4 -6 4"/>

    <rect class="box" x="435" y="51" width="73" height="54"/>
    <text x="452" y="84" class="small">FPGA</text>

    <path class="line2" d="M241 105 v48 h232 v-48"/>
    <path class="line2" d="M241 153 v-40"/>
    <path class="line2" d="M473 153 v-40"/>
    <path class="line2" d="M237 117 l4-5 4 5 M469 117 l4-5 4 5"/>

    <text x="151" y="210" class="small dim">IDEAS → LOGIC → IMPLEMENTATION</text>
  </g>

  <!-- Center identity -->
  <g transform="translate(768,104)" text-anchor="middle" class="mono">
    <text y="42" font-size="34" letter-spacing="8">MAHDI</text>
    <text y="82" font-size="34" letter-spacing="7">MOHAMMADI</text>
    <line x1="-22" y1="112" x2="22" y2="112" class="line"/>
    <text y="150" class="small dim">ELECTRICAL ENGINEERING</text>
    <text y="177" class="small dim">HARDWARE × COMPUTER VISION</text>
  </g>

  <!-- Right vision pipeline -->
  <g transform="translate(990,82)" class="mono">
    <!-- stylized input plane -->
    <polygon points="0,48 88,0 88,146 0,180" fill="#bcc4cc" opacity="0.18" stroke="#d7dde4" stroke-width="1.2"/>
    <polyline points="11,151 33,116 46,124 61,84 74,99 88,91" fill="none" stroke="#aeb8c2" stroke-width="1.1"/>
    <polyline points="14,153 28,139 39,143 52,121 66,128 82,113" fill="none" stroke="#74808b" stroke-width="1"/>

    <!-- arrows -->
    <path class="line2" d="M90 84 h21"/><path class="line2" d="M106 80 l6 4 -6 4"/>

    <!-- feature map 1 -->
    <polygon points="115,54 166,25 166,145 115,158" fill="none" stroke="#d7dde4" stroke-width="1.1"/>
    <g stroke="#8f9ca8" stroke-width="0.8">
      <path d="M125 49 v106 M136 43 v109 M147 37 v112 M158 31 v115"/>
      <path d="M116 79 l50-29 M116 101 l50-29 M116 123 l50-29 M116 145 l50-29"/>
    </g>

    <path class="line2" d="M168 85 h18"/><path class="line2" d="M181 81 l6 4 -6 4"/>

    <!-- feature map 2 -->
    <polygon points="188,63 236,37 236,137 188,154" fill="none" stroke="#d7dde4" stroke-width="1.1"/>
    <g stroke="#8f9ca8" stroke-width="0.8">
      <path d="M198 58 v93 M208 53 v95 M218 48 v96 M228 42 v98"/>
      <path d="M189 85 l47-26 M189 105 l47-26 M189 125 l47-26 M189 145 l47-26"/>
    </g>

    <path class="line2" d="M238 88 h16"/><path class="line2" d="M249 84 l6 4 -6 4"/>

    <!-- feature map 3 -->
    <polygon points="258,76 294,57 294,130 258,143" fill="none" stroke="#d7dde4" stroke-width="1.1"/>
    <g stroke="#8f9ca8" stroke-width="0.75">
      <path d="M267 71 v68 M276 66 v70 M285 61 v72"/>
      <path d="M259 94 l35-19 M259 111 l35-19 M259 128 l35-19"/>
    </g>

    <path class="line2" d="M296 98 h18"/><path class="line2" d="M309 94 l6 4 -6 4"/>

    <!-- output -->
    <rect x="322" y="83" width="58" height="74" fill="#0f151a" stroke="#d7dde4" stroke-width="1.1"/>
    <g fill="#d7dde4">
      <rect x="338" y="104" width="8" height="8" opacity=".25"/>
      <rect x="346" y="112" width="8" height="8" opacity=".45"/>
      <rect x="354" y="120" width="8" height="8" opacity=".8"/>
      <rect x="346" y="128" width="8" height="8" opacity=".7"/>
      <rect x="338" y="120" width="8" height="8" opacity=".35"/>
      <rect x="354" y="112" width="8" height="8" opacity=".3"/>
      <rect x="362" y="128" width="8" height="8" opacity=".45"/>
    </g>

    <text x="421" y="13" class="tiny">pixels</text>
    <text x="421" y="42" class="tiny">filters</text>
    <text x="421" y="71" class="tiny">features</text>
    <text x="421" y="100" class="tiny">understanding</text>
    <text x="421" y="129" class="tiny">...</text>

    <text x="137" y="210" class="small dim">FROM DATA TO PERCEPTION</text>
  </g>

  <!-- Main intro -->
  <g transform="translate(63,386)" class="mono">
    <text x="0" y="43" font-size="50" font-weight="500">Hi, I’m Mahdi</text>
    <text x="0" y="86" font-size="23">Electrical Engineering student.</text>
    <line x1="0" y1="118" x2="44" y2="118" class="line2"/>
    <text x="0" y="163" class="body">I’m interested in digital hardware and computer vision.</text>
    <text x="0" y="196" class="body">I like working close to the implementation — understanding how things work,</text>
    <text x="0" y="229" class="body">building them from the ground up, and testing the assumptions along the way.</text>
  </g>

  <!-- Quote -->
  <g transform="translate(1220,432)" class="mono dim">
    <text x="0" y="36" font-size="19">“Better understanding</text>
    <text x="15" y="65" font-size="19">leads to better systems.”</text>
    <line x1="15" y1="92" x2="58" y2="92" class="line2"/>
  </g>

  <!-- Sections -->
  <g transform="translate(63,653)" class="mono">
    <!-- Hardware icon -->
    <rect x="9" y="19" width="32" height="32" rx="2" fill="none" stroke="#d8dee9" stroke-width="2"/>
    <g stroke="#d8dee9" stroke-width="2">
      <line x1="0" y1="26" x2="9" y2="26"/><line x1="0" y1="35" x2="9" y2="35"/><line x1="0" y1="44" x2="9" y2="44"/>
      <line x1="41" y1="26" x2="50" y2="26"/><line x1="41" y1="35" x2="50" y2="35"/><line x1="41" y1="44" x2="50" y2="44"/>
      <line x1="16" y1="10" x2="16" y2="19"/><line x1="25" y1="10" x2="25" y2="19"/><line x1="34" y1="10" x2="34" y2="19"/>
      <line x1="16" y1="51" x2="16" y2="60"/><line x1="25" y1="51" x2="25" y2="60"/><line x1="34" y1="51" x2="34" y2="60"/>
    </g>
    <text x="78" y="48" class="section">Hardware</text>
    <text x="0" y="101" class="body">→  RTL design and verification</text>
    <text x="0" y="134" class="body">→  Processor and digital systems</text>
    <text x="0" y="167" class="body">→  FPGA development</text>
    <text x="0" y="200" class="body">→  EDA automation</text>
  </g>

  <line x1="528" y1="657" x2="528" y2="870" stroke="#34414b" stroke-width="1"/>

  <g transform="translate(585,653)" class="mono">
    <!-- vision icon -->
    <rect x="0" y="18" width="43" height="34" fill="none" stroke="#d8dee9" stroke-width="2"/>
    <circle cx="13" cy="28" r="3.3" fill="none" stroke="#d8dee9" stroke-width="1.6"/>
    <polyline points="6,47 18,35 27,42 35,33 41,39" fill="none" stroke="#d8dee9" stroke-width="1.7"/>
    <text x="81" y="48" class="section">Vision</text>
    <text x="0" y="101" class="body">→  Image processing</text>
    <text x="0" y="134" class="body">→  Computer vision</text>
    <text x="0" y="167" class="body">→  Deep learning for visual problems</text>
    <text x="0" y="200" class="body">→  From algorithms to real-world use</text>
  </g>

  <line x1="1029" y1="657" x2="1029" y2="870" stroke="#34414b" stroke-width="1"/>

  <g transform="translate(1084,653)" class="mono">
    <!-- terminal icon -->
    <rect x="0" y="18" width="40" height="34" rx="2" fill="none" stroke="#d8dee9" stroke-width="2"/>
    <polyline points="9,29 15,35 9,41" fill="none" stroke="#d8dee9" stroke-width="1.8"/>
    <line x1="19" y1="42" x2="30" y2="42" stroke="#d8dee9" stroke-width="1.8"/>
    <text x="74" y="48" class="section">Tools</text>
    <text x="0" y="101" class="body">→  SystemVerilog</text>
    <text x="0" y="134" class="body">→  Python</text>
    <text x="0" y="167" class="body">→  C / C++</text>
    <text x="0" y="200" class="body">→  MATLAB (when it makes sense)</text>
    <text x="0" y="233" class="body">→  Common EDA and ML tools</text>
  </g>

  <!-- Terminal footer -->
  <rect x="22" y="925" width="1491" height="67" rx="10" fill="#0b1014" stroke="#27343d" stroke-width="1"/>
  <text x="53" y="965" class="mono dim" font-size="16">mahdi@github:~$</text>
  <rect x="229" y="949" width="10" height="19" fill="#b8c2cc"/>
  <text x="1098" y="965" class="mono faint" font-size="13" letter-spacing="2.2">STUDY / BUILD / EXPERIMENT / REPEAT</text>
</svg>